plugins {
    id 'java'
    id 'application'
}

apply plugin: 'application'
apply plugin: 'java'

group = 'gdn.hypercube'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:0.4.2'

    // NOTE: This is for DEBUG platform.
    implementation "org.lwjgl:lwjgl:3.3.6"
    implementation "org.lwjgl:lwjgl-glfw:3.3.6"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.6"
    implementation "org.lwjgl:lwjgl-nuklear:3.3.6"
    implementation "org.lwjgl:lwjgl-openal:3.3.6"
    implementation "org.lwjgl:lwjgl-opengl:3.3.6"
    implementation "org.lwjgl:lwjgl-par:3.3.6"
    implementation "org.lwjgl:lwjgl-stb:3.3.6"
    implementation "org.lwjgl:lwjgl-vulkan:3.3.6"
    implementation "org.lwjgl:lwjgl:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-glfw:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-nanovg:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-nuklear:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-openal:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-opengl:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-par:3.3.6:natives-linux"
    implementation "org.lwjgl:lwjgl-stb:3.3.6:natives-linux"
}

configure([tasks.compileJava]) {
    sourceCompatibility = 17
    options.release = 8

    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'gdn.hypercube.epsilon.cli.EpsilonCCScriptCompiler'
        )
    }
}